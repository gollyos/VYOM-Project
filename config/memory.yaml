version: 1
embeddings:
  # Real semantic embeddings via the same free Gemini key ("ghar ka
  # budget" finally matches "household expenses"). Falls back to the
  # local hash provider whenever the key/network/quota is unavailable.
  # Privacy note: embedding sends memory text to Google, same as every
  # Brain model call; HIGHLY_SENSITIVE secrets are already rejected at
  # write time. Set provider back to local_hash to stay fully offline.
  provider: gemini
  dimensions: 96
  allow_remote: true
retrieval:
  default_limit: 8
  max_candidates: 500
  project_context_boost: 0.18
consolidation:
  minimum_importance: 0.45
  save_verified_tasks: true
privacy:
  default_sensitivity: normal
  external_model_max_sensitivity: sensitive
  reject_secret_patterns: true
learning:
  event_driven_only: true
  minimum_lesson_confidence: 0.65
  max_lessons_per_task: 2
