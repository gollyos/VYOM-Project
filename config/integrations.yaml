version: 1
integrations:
  - id: gmail
    name: Gmail
    provider: google
    category: email
    enabled: true
    status: disconnected
    capabilities: [email.search, email.read, email.draft, email.send, email.thread]
    metadata:
      oauth: required
      secret_storage: windows-dpapi
  - id: google-calendar
    name: Google Calendar
    provider: google
    category: calendar
    enabled: false
    status: disconnected
    capabilities: [calendar.read, calendar.availability, calendar.create]
    metadata:
      oauth: required
      secret_storage: windows-dpapi
  - id: google-contacts
    name: Google Contacts
    provider: google
    category: contacts
    enabled: false
    status: disconnected
    capabilities: [contacts.read, contacts.resolve]
    metadata:
      oauth: required
      secret_storage: windows-dpapi
  - id: google-sheets
    name: Google Sheets
    provider: google
    category: productivity
    enabled: true
    status: disconnected
    capabilities: [sheets.create, sheets.read, sheets.write, sheets.append]
    metadata:
      oauth: required
      secret_storage: windows-dpapi
  - id: youtube
    name: YouTube
    provider: google
    category: content
    enabled: true
    status: disconnected
    capabilities: [video.upload]
    metadata:
      oauth: required
      secret_storage: windows-dpapi
  - id: instagram
    name: Instagram
    provider: meta
    category: content
    enabled: true
    status: disconnected
    capabilities: [social.post, social.message]
    metadata:
      auth: access_token
      secret_storage: windows-dpapi
  - id: facebook
    name: Facebook
    provider: meta
    category: content
    enabled: true
    status: disconnected
    capabilities: [social.post]
    metadata:
      auth: access_token
      secret_storage: windows-dpapi
  - id: linkedin
    name: LinkedIn
    provider: linkedin
    category: content
    enabled: true
    status: disconnected
    capabilities: [social.post]
    metadata:
      auth: access_token
      secret_storage: windows-dpapi
  - id: twitter
    name: Twitter/X
    provider: twitter
    category: content
    enabled: true
    status: disconnected
    capabilities: [social.post]
    metadata:
      auth: access_token
      secret_storage: windows-dpapi
  - id: meta-ads
    name: Meta Ads
    provider: meta
    category: advertising
    enabled: true
    status: disconnected
    capabilities: [ads.campaign_create]
    metadata:
      auth: access_token
      secret_storage: windows-dpapi
      safety: campaigns always created PAUSED, daily budget hard-capped at $100
  - id: telegram
    name: Telegram
    provider: telegram
    category: messaging
    enabled: true
    status: disconnected
    capabilities: [telegram.send, telegram.poll, telegram.list_chats]
    metadata:
      auth: bot_token
      secret_storage: windows-dpapi
  - id: discord
    name: Discord
    provider: discord
    category: messaging
    enabled: true
    status: disconnected
    capabilities: [discord.send, discord.list_guilds]
    metadata:
      auth: bot_token
      secret_storage: windows-dpapi
  - id: lead-research
    name: Lead Research Provider
    provider: unconfigured
    category: research
    enabled: false
    status: disconnected
    capabilities: [agency.lead_research]
    metadata:
      test_fixture_allowed: true
