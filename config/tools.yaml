version: 1
allowed_roots:
  - ${VYOM_PROJECT_ROOT:-C:\\VYOM Project}
tools:
  filesystem:
    enabled: true
    risk: low
  terminal:
    enabled: true
    risk: medium
  git:
    enabled: true
    risk: medium
  browser:
    enabled: true
    risk: medium
  screenshot:
    enabled: true
    risk: medium
  system:
    enabled: true
    risk: medium
  weather:
    enabled: true
    risk: low
  currency:
    enabled: true
    risk: low
  crypto:
    enabled: true
    risk: low
  facts:
    enabled: true
    risk: low
  wikipedia:
    enabled: true
    risk: low
  news:
    enabled: true
    risk: low
  whatsapp:
    enabled: true
    risk: medium
mcp_servers:
  # Real MCP servers VYOM connects to automatically on boot. Every entry
  # below is CREDENTIAL-FREE and was live-verified connected (2026-08-25):
  # real MCP handshake completed, real tools registered into the shared
  # ToolRegistry alongside the built-in tools.
  - id: fs-temp
    name: "Filesystem (Project + Temp scratch space)"
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "${TEMP}", "${VYOM_PROJECT_ROOT:-C:\\VYOM Project}"]
    trust_level: restricted
    timeout_seconds: 45
  - id: memory
    name: "Memory (knowledge graph)"
    command: npx
    args: ["-y", "@modelcontextprotocol/server-memory"]
    trust_level: restricted
    timeout_seconds: 45
  - id: seq-thinking
    name: "Sequential Thinking"
    command: npx
    args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]
    trust_level: restricted
    timeout_seconds: 45
  - id: duckduckgo
    name: "DuckDuckGo Search"
    command: npx
    args: ["-y", "duckduckgo-mcp-server"]
    trust_level: restricted
    timeout_seconds: 45
  - id: web-fetch
    name: "Web Fetch (official)"
    command: uvx
    args: ["mcp-server-fetch"]
    trust_level: restricted
    timeout_seconds: 45
  - id: git
    name: "Git Operations"
    command: uvx
    args: ["mcp-server-git", "--repository", "${VYOM_PROJECT_ROOT:-C:\\VYOM Project}"]
    trust_level: restricted
    timeout_seconds: 45
  - id: time
    name: "Time/Timezone"
    command: uvx
    args: ["mcp-server-time"]
    trust_level: restricted
    timeout_seconds: 45
  - id: everything
    name: "Everything (reference tools)"
    command: npx
    args: ["-y", "@modelcontextprotocol/server-everything"]
    trust_level: restricted
    timeout_seconds: 45
  - id: wikipedia
    name: "Wikipedia"
    command: npx
    args: ["-y", "wikipedia-mcp"]
    trust_level: restricted
    timeout_seconds: 45
  - id: hackernews
    name: "Hacker News"
    command: npx
    args: ["-y", "hn-mcp-server"]
    trust_level: restricted
    timeout_seconds: 45
  # -- Tested, not added (broken / needs extra deps) --
  # arxiv-mcp-server        -> handshake timeout (>45s), unreliable
  # mcp-server-sqlite (uvx) -> upstream bug: Server object has no attribute
  #                            'list_resources' (MCP SDK version mismatch)
  # youtube-transcript-mcp  -> requires the `bun` runtime, not installed
  # fetch-mcp (npm)         -> handshake timeout; web-fetch (uvx) covers it
  #
  # -- Needs YOUR credentials (add the key below, then this list) --
  # @modelcontextprotocol/server-github    -> needs GITHUB_PERSONAL_ACCESS_TOKEN
  # @modelcontextprotocol/server-slack     -> needs SLACK_BOT_TOKEN
  # @modelcontextprotocol/server-postgres  -> needs a DB connection string
  # @modelcontextprotocol/server-puppeteer -> credential-free but pulls a
  #                            real Chromium download; add on request
