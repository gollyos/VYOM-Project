version: 1

schema_version: 1
# Custom model configuration for VYOM project
# Enabled: ONLY poolside/laguna-xs-2.1:free (fast, free-tier, OpenRouter)
#   All other models disabled to avoid rate limits - swithc to this when ready
models:
  # ENABLED as a working fallback: gemini is the only provider with a
  # configured key (GEMINI_API_KEY), so the router can actually satisfy
  # LLM tasks. poolside stays enabled as the preferred model, but it is
  # skipped by the router until an OPENROUTER_API_KEY is set.
  - provider: google
    model_id: gemini-3.1-flash-lite
    enabled: true
    capabilities: [reasoning, coding, vision, research, structured_output, tool_use, general, planning]
    quality_tier: balanced
    speed_tier: fast
    cost_tier: low
    context_tier: large
    supports_streaming: true
    supports_tools: true
    supports_vision: true
    privacy_policy: cloud_standard
    priority: 80

  - provider: google
    model_id: gemini-flash-lite-latest
    enabled: false
    capabilities: [reasoning, coding, vision, research, structured_output, tool_use, general, planning]
    quality_tier: balanced
    speed_tier: fast
    cost_tier: low
    context_tier: large
    supports_streaming: true
    supports_tools: true
    supports_vision: true
    privacy_policy: cloud_standard
    priority: 75

  - provider: google
    model_id: gemini-flash-latest
    enabled: false
    capabilities: [reasoning, coding, vision, research, structured_output, tool_use, general, planning]
    quality_tier: balanced
    speed_tier: fast
    cost_tier: low
    context_tier: large
    supports_streaming: true
    supports_tools: true
    supports_vision: true
    privacy_policy: cloud_standard
    priority: 72

  # DISABLED: OpenAI - rate limits on free tier
  - provider: openai
    model_id: gpt-4o-mini
    enabled: false
    capabilities: [reasoning, coding, vision, research, structured_output, tool_use, general, planning]
    quality_tier: high
    speed_tier: balanced
    cost_tier: medium
    context_tier: large
    supports_streaming: true
    supports_tools: true
    supports_vision: true
    privacy_policy: cloud_standard
    priority: 70

  # DISABLED: Anthropic - rate limits on free tier
  - provider: anthropic
    model_id: claude-3-5-sonnet-20241022
    enabled: false
    capabilities: [reasoning, coding, vision, research, structured_output, tool_use, general, planning]
    quality_tier: high
    speed_tier: balanced
    cost_tier: medium
    context_tier: large
    supports_streaming: true
    supports_tools: true
    supports_vision: true
    privacy_policy: cloud_standard
    priority: 70

  # ENABLED: OpenRouter poolside free/fast model
  - provider: openrouter
    model_id: poolside/laguna-xs-2.1:free
    enabled: true
    capabilities: [reasoning, coding, vision, research, structured_output, tool_use, general, planning]
    quality_tier: configurable
    speed_tier: configurable
    cost_tier: configurable
    context_tier: configurable
    supports_streaming: true
    supports_tools: true
    supports_vision: true
    privacy_policy: cloud_routed
    priority: 60

  # DISABLED: DeepSeek - rate limits
  - provider: deepseek
    model_id: deepseek-chat
    enabled: false
    capabilities: [reasoning, coding, structured_output, general, planning]
    quality_tier: balanced
    speed_tier: balanced
    cost_tier: low
    context_tier: large
    supports_streaming: true
    supports_tools: true
    supports_vision: false
    privacy_policy: cloud_standard
    priority: 60

  # DISABLED: Kimi - rate limits
  - provider: kimi
    model_id: kimi-k2-latest
    enabled: false
    capabilities: [reasoning, coding, research, structured_output, tool_use, general, planning]
    quality_tier: balanced
    speed_tier: balanced
    cost_tier: low
    context_tier: very_large
    supports_streaming: true
    supports_tools: true
    supports_vision: false
    privacy_policy: cloud_standard
    priority: 60

  # ENABLED: keyless free model via the OpenCode Zen relay (no signup, no
  # API key - the relay serves its "-free" model family anonymously).
  # Same mechanism used to connect Hermes Agent to "Ox Alpha" for free.
  # Kept BELOW gemini in priority: gemini is the confirmed-stable primary,
  # this is a genuinely free second opinion / fallback when gemini's
  # quota is exhausted, not a replacement.
  - provider: opencode-free
    model_id: hy3-free
    enabled: true
    capabilities: [reasoning, coding, research, structured_output, tool_use, general, planning]
    quality_tier: balanced
    speed_tier: fast
    cost_tier: free
    context_tier: large
    supports_streaming: false
    supports_tools: false
    supports_vision: false
    privacy_policy: cloud_standard
    priority: 65