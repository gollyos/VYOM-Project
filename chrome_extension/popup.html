<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>VYOM Browser Bridge</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; width: 300px; padding: 14px; color: #1b1f24; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #999; }
  .dot.connected { background: #22a55a; }
  .dot.connecting { background: #e0a92e; }
  .dot.disconnected, .dot.unpaired { background: #d3453a; }
  label { display: block; font-size: 12px; margin: 10px 0 4px; color: #555; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 12px; border: 1px solid #ccc; border-radius: 6px; }
  button { width: 100%; margin-top: 10px; padding: 7px; font-size: 13px; border: none; border-radius: 6px; cursor: pointer; }
  .primary { background: #2563eb; color: white; }
  .secondary { background: #eee; color: #222; margin-top: 6px; }
  .hint { font-size: 11px; color: #777; margin-top: 8px; line-height: 1.4; }
</style>
</head>
<body>
  <h1>VYOM Browser Bridge</h1>
  <div class="status"><span id="dot" class="dot"></span><span id="statusText">checking…</span></div>

  <label for="url">VYOM Brain address</label>
  <input id="url" type="text" placeholder="ws://127.0.0.1:7788/api/extension/ws" />

  <label for="token">Pairing token</label>
  <input id="token" type="text" placeholder="paste the token from VYOM" />

  <button id="save" class="primary">Save &amp; connect</button>
  <button id="openPairing" class="secondary">Open pairing page</button>

  <div class="hint">
    First time: click "Open pairing page", copy the <code>token</code> value
    shown there, paste it above, then Save &amp; connect.
  </div>
  <script src="popup.js"></script>
</body>
</html>
